# `packages` is required by pnpm 9 — the version CI pins — which errors with
# "packages field missing or empty" if this file exists without it.
# `allowBuilds` is read only by pnpm 10+, which otherwise exits non-zero when a
# dependency's install scripts are skipped. Both keys are present so the same
# checkout installs cleanly under either version; dropping either one breaks a
# real environment.
packages:
  - '.'
allowBuilds:
  '@google/genai': true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
